# main 에 engine/ 또는 server/ 가 바뀌어 올라오면: 테스트 → 통과하면 Hugging Face Space 로 서버 배포
name: API 서버 배포 (Hugging Face)

on:
  push:
    branches: [main]
    paths: ["engine/**", "server/**", "scripts/deploy_space.py", "tests/**", ".github/workflows/deploy-space.yml"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: 한글 글꼴 설치 (서버와 같은 나눔고딕)
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum poppler-utils
      - run: pip install -r requirements.txt -r server/requirements.txt httpx
      - name: 엔진 + 서버 테스트
        env: { PLANNER_FONT: /usr/share/fonts/truetype/nanum/NanumGothic.ttf }
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: 접속 키 확인
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::저장소 Settings > Secrets 에 HF_TOKEN 이 없습니다. 배포를 건너뜁니다."
            exit 1
          fi
      - run: pip install huggingface_hub
      - name: Space 로 올리기
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        # 파이프(| tee)를 쓰면 실패해도 성공으로 표시되므로 쓰지 않는다
        run: python scripts/deploy_space.py
