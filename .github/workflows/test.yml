# 테스트만 돌린다. 서버 배포는 Render 가 main 을 보고 자동으로 한다(render.yaml).
# (Hugging Face 는 Docker 서버가 유료(PRO)로 바뀌어 사용하지 않음)
name: 엔진·서버 테스트

on:
  push:
    branches: [main]
    paths: ["engine/**", "server/**", "tests/**", ".github/workflows/**"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: 한글 글꼴 설치 (서버와 같은 나눔고딕)
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - run: pip install -r requirements.txt -r server/requirements.txt httpx
      - name: 엔진 + 서버 테스트
        env: { PLANNER_FONT: /usr/share/fonts/truetype/nanum/NanumGothic.ttf }
        run: python -m pytest -q
